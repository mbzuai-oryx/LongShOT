<!-- Audio Issue Report Modal -->
<div class="modal fade" id="audio-issue-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-microphone-slash text-danger me-2"></i> Report Audio Issue
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="audio-issue-form">
                    <div class="mb-3">
                        <label class="form-label">Issue Type</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="issueType" id="issue-type-1" value="no-audio">
                            <label class="form-check-label" for="issue-type-1">
                                No audio in this segment
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="issueType" id="issue-type-2" value="low-quality">
                            <label class="form-check-label" for="issue-type-2">
                                Audio quality too poor
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="issueType" id="issue-type-3" value="background-noise">
                            <label class="form-check-label" for="issue-type-3">
                                Too much background noise
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="issueType" id="issue-type-4" value="other">
                            <label class="form-check-label" for="issue-type-4">
                                Other issue
                            </label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="issue-notes" class="form-label">Additional Notes</label>
                        <textarea class="form-control" id="issue-notes" rows="3" 
                                placeholder="Please provide any additional details about the issue..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="submit-issue-btn" class="btn btn-danger">
                    <i class="fas fa-exclamation-triangle me-1"></i> Report Issue
                </button>
            </div>
        </div>
    </div>
</div>
