<!-- Timing Adjustment Modal -->
<div class="modal fade" id="timing-adjustment-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-clock text-primary me-2"></i> Adjust Segment Timing
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="timing-adjustment-form">
                    <!-- Start Time -->
                    <div class="mb-3">
                        <label class="form-label">Start Time</label>
                        <div class="row g-2">
                            <div class="col">
                                <div class="input-group">
                                    <input type="number" step="0.1" class="form-control" id="start-time" 
                                           value="{{ segment.start_time }}">
                                    <span class="input-group-text">seconds</span>
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-outline-primary set-current-time" 
                                        data-target="start-time">
                                    <i class="fas fa-crosshairs me-1"></i> Set Current
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- End Time -->
                    <div class="mb-3">
                        <label class="form-label">End Time</label>
                        <div class="row g-2">
                            <div class="col">
                                <div class="input-group">
                                    <input type="number" step="0.1" class="form-control" id="end-time" 
                                           value="{{ segment.end_time }}">
                                    <span class="input-group-text">seconds</span>
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-outline-primary set-current-time" 
                                        data-target="end-time">
                                    <i class="fas fa-crosshairs me-1"></i> Set Current
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Duration Info -->
                    <div class="alert alert-info">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-info-circle me-2"></i>
                            <div>
                                <strong>Segment Duration:</strong>
                                <span id="segment-duration">{{ "%.1f"|format(segment.end_time - segment.start_time) }}</span> seconds
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="me-auto">
                    <button type="button" class="btn btn-outline-secondary" id="preview-timing-btn">
                        <i class="fas fa-play me-1"></i> Preview
                    </button>
                </div>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="save-timing-btn" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> Save Changes
                </button>
            </div>
        </div>
    </div>
</div>
